<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Portal | Punarchakra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f8fafc;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow-x: hidden;
    padding: 40px 20px;
}

body::before {
    content: "";
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 20%, rgba(5,150,105,0.06), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(5,150,105,0.04), transparent 30%);
    z-index: -2;
}

.auth-container {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    position: relative;
    z-index: 1;
}

.auth-logo {
    text-align: center;
    margin-bottom: 30px;
}

.auth-logo a {
    text-decoration: none;
    display: inline-block;
}

.auth-logo h2 {
    color: #0f172a;
    font-size: 22px;
    font-weight: 700;
    margin-top: 8px;
}

.auth-logo p {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
}

.tabs {
    display: flex;
    background: #f1f5f9;
    border-radius: 50px;
    padding: 5px;
    margin-bottom: 30px;
    border: 1px solid #e2e8f0;
}

.tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #64748b;
    padding: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 50px;
    transition: 0.3s;
}

.tab-btn.active {
    background: #059669;
    color: white;
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
}

.form-box {
    display: none;
}

.form-box.active {
    display: block;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    font-size: 13px;
    color: #334155;
    margin-bottom: 8px;
    font-weight: 500;
}

.input-field {
    position: relative;
}

.input-field i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
}

.input-field input {
    width: 100%;
    padding: 14px 16px 14px 48px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    color: #0f172a;
    font-size: 15px;
    transition: 0.3s;
}

.input-field input:focus {
    border-color: #059669;
    outline: none;
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    background: #ffffff;
}

.submit-btn {
    width: 100%;
    padding: 15px;
    background: #059669;
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
}

.submit-btn:hover {
    background: #047857;
    transform: translateY(-1px);
}

.error-msg {
    color: #dc2626;
    font-size: 13px;
    margin-bottom: 15px;
    text-align: center;
    display: none;
    background: rgba(220, 38, 38, 0.08);
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(220, 38, 38, 0.2);
}

.back-home {
    text-align: center;
    margin-top: 25px;
}

.back-home a {
    color: #64748b;
    text-decoration: none;
    font-size: 13px;
    transition: 0.3s;
}

.back-home a:hover {
    color: #059669;
}
</style>
</head>
<body>

<div class="auth-container">
    <div class="auth-logo">
        <a href="index.html">
            <i class="fa-solid fa-recycle" style="font-size: 32px; color: #059669;"></i>
            <h2>Punarchakra</h2>
        </a>
        <p>Industrial Symbiosis Portal</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login', event)">Login</button>
        <button class="tab-btn" onclick="switchTab('register', event)">Register</button>
    </div>

    <form id="login-form" class="form-box active">
        <div id="login-error" class="error-msg"></div>
        <div class="input-group">
            <label>Corporate Email</label>
            <div class="input-field">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="login-email" placeholder="company@industry.com" required>
            </div>
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-field">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="submit-btn">Login to Platform</button>
    </form>

    <form id="register-form" class="form-box">
        <div id="register-error" class="error-msg"></div>
        <div class="input-group">
            <label>Industry / Company Name</label>
            <div class="input-field">
                <i class="fa-solid fa-building"></i>
                <input type="text" id="register-company" placeholder="Apex Steel Ltd." required>
            </div>
        </div>
        <div class="input-group">
            <label>Corporate Email</label>
            <div class="input-field">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="register-email" placeholder="contact@company.com" required>
            </div>
        </div>
        <div class="input-group">
            <label>Create Password</label>
            <div class="input-field">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="register-password" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="submit-btn">Register Industry</button>
    </form>

    <div class="back-home">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>
    </div>
</div>

<script type="module">
    import { auth, db } from "./firebase-config.js";
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    window.switchTab = function(tab, event) {
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const buttons = document.querySelectorAll('.tab-btn');

        buttons.forEach(btn => btn.classList.remove('active'));

        if(tab === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            event.currentTarget.classList.add('active');
        } else {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            event.currentTarget.classList.add('active');
        }
    };

    // Handle Login Submissions via Firebase Auth
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorBox = document.getElementById('login-error');
        errorBox.style.display = "none";

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "index.html";
        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.style.display = "block";
        }
    });

    // Handle Registration Submissions via Firebase Auth & Firestore
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const company = document.getElementById('register-company').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const errorBox = document.getElementById('register-error');
        errorBox.style.display = "none";

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            await setDoc(doc(db, "industries", user.uid), {
                companyName: company,
                email: email,
                createdAt: new Date().toISOString()
            });

            window.location.href = "index.html";
        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.style.display = "block";
        }
    });
</script>

</body>
</html>
