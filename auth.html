<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Access | Punarchakra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

:root {
    --bg-deep: #050505;
    --eco-primary: #22ff88;
    --eco-glow: rgba(34, 255, 136, 0.4);
    --border-color: rgba(255, 255, 255, 0.08);
    --card-bg: rgba(255, 255, 255, 0.02);
}

body {
    background: var(--bg-deep);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
}

/* Animated Background */
body::before {
    content: "";
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 20%, rgba(0,255,120,.12), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(0,180,255,.1), transparent 30%);
    z-index: -3;
}

.grid {
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: -2;
    opacity: .3;
}

.back-home {
    position: absolute;
    top: 30px;
    left: 40px;
    color: #a0aec0;
    text-decoration: none;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.3s;
}

.back-home:hover {
    color: #22ff88;
}

.auth-container {
    width: 100%;
    max-width: 450px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    position: relative;
    z-index: 2;
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-header i {
    font-size: 42px;
    color: #22ff88;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 10px var(--eco-glow));
}

.auth-header h2 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
}

.auth-header p {
    color: #94a3b8;
    font-size: 14px;
}

/* Tabs */
.auth-tabs {
    display: flex;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 5px;
    margin-bottom: 30px;
}

.tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: #94a3b8;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 40px;
    transition: 0.3s;
}

.tab-btn.active {
    background: #22ff88;
    color: black;
    box-shadow: 0 0 15px rgba(34,255,136,0.3);
}

/* Form Styles */
form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-size: 13px;
    font-weight: 500;
    color: #cbd5e1;
}

.input-box {
    position: relative;
    display: flex;
    align-items: center;
}

.input-box i {
    position: absolute;
    left: 16px;
    color: #64748b;
}

.input-box input {
    width: 100%;
    padding: 14px 16px 14px 45px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: white;
    font-size: 14px;
    transition: 0.3s;
}

.input-box input:focus {
    outline: none;
    border-color: #22ff88;
    box-shadow: 0 0 10px rgba(34,255,136,0.2);
}

.submit-btn {
    margin-top: 10px;
    padding: 14px;
    background: #22ff88;
    color: black;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 20px rgba(34,255,136,0.2);
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px #22ff88;
}

.form-section {
    display: none;
}

.form-section.active {
    display: block;
}
</style>
</head>
<body>

<div class="grid"></div>

<a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

<div class="auth-container">
    <div class="auth-header">
        <i class="fa-solid fa-recycle"></i>
        <h2>Welcome to Punarchakra</h2>
        <p>Industrial Symbiosis Authentication Portal</p>
    </div>

    <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register Industry</button>
    </div>

    <!-- Login Form -->
    <div id="login-section" class="form-section active">
        <form onsubmit="event.preventDefault(); alert('Login functionality connected!');">
            <div class="form-group">
                <label>Industry Email / ID</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="company@industry.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="submit-btn">Login to Dashboard</button>
        </form>
    </div>

    <!-- Register Form -->
    <div id="register-section" class="form-section">
        <form onsubmit="event.preventDefault(); alert('Registration submitted successfully!');">
            <div class="form-group">
                <label>Industry / Company Name</label>
                <div class="input-box">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" placeholder="Apex Steel Ltd." required>
                </div>
            </div>
            <div class="form-group">
                <label>Official Corporate Email</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="contact@apexsteel.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="submit-btn">Register Industry</button>
        </form>
    </div>
</div>

<script>
function switchTab(tab) {
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const buttons = document.querySelectorAll('.tab-btn');

    buttons.forEach(btn => btn.classList.remove('active'));

    if(tab === 'login') {
        loginSection.classList.add('active');
        registerSection.classList.remove('active');
        buttons[0].classList.add('active');
    } else {
        registerSection.classList.add('active');
        loginSection.classList.remove('active');
        buttons[1].classList.add('active');
    }
}
</script>

</body>
</html>
