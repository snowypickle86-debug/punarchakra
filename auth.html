<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Punarchakra</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --bg-deep: #050505;
            --eco-primary: #22ff88;
            --eco-glow: rgba(34, 255, 136, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(20, 20, 20, 0.7);
        }

        body {
            background: var(--bg-deep);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* Animated Background */
        body::before {
            content: "";
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0,255,120,.15), transparent 25%),
                radial-gradient(circle at 80% 30%, rgba(0,180,255,.12), transparent 30%),
                radial-gradient(circle at 50% 80%, rgba(0,255,150,.08), transparent 35%);
            z-index: -3;
            animation: bgmove 20s linear infinite alternate;
        }

        @keyframes bgmove {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.05); }
        }

        /* Grid */
        .grid {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            opacity: .3;
        }

        /* Back Button */
        .back-home {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #22ff88;
        }

        /* Auth Container Box */
        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(34, 255, 136, 0.3);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
            animation: float 6s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header i {
            font-size: 38px;
            color: #22ff88;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px var(--eco-glow));
        }

        .auth-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .auth-header h2 span {
            color: #22ff88;
        }

        .auth-header p {
            font-size: 13px;
            color: #aaa;
            margin-top: 5px;
        }

        /* Form Inputs & Controls */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #22ff88;
            box-shadow: 0 0 10px rgba(34, 255, 136, 0.2);
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: #22ff88;
            color: black;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 5px;
            box-shadow: 0 0 20px rgba(34,255,136,0.2);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px #22ff88;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #111;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .google-btn:hover {
            background: #eaeaea;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #666;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }

        .auth-switch span {
            color: #22ff88;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-switch span:hover {
            text-decoration: underline;
        }

        /* Error/Success message box */
        #statusMsg {
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
        }

        @media(max-width: 500px) {
            .back-home { left: 20px; top: 15px; }
            .auth-container { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="grid"></div>

    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <div class="auth-container">
        <div class="auth-header">
            <i class="fa-solid fa-recycle"></i>
            <h2 id="formTitle">Industry <span>Login</span></h2>
            <p id="formSubTitle">Access your industrial symbiosis dashboard</p>
        </div>

        <!-- Google Authentication Button -->
        <button type="button" class="google-btn" id="googleAuthBtn">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
        </button>

        <div class="divider">OR WORK EMAIL</div>

        <!-- Email & Password Form -->
        <form id="authForm">
            <div class="input-group">
                <label>Work Email</label>
                <input type="email" id="email" required placeholder="factory@industry.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="primary-btn" id="submitBtn">Sign In</button>
        </form>

        <div id="statusMsg"></div>

        <div class="auth-switch">
            <p id="switchText">Need an account? <span onclick="toggleMode()">Sign Up</span></p>
        </div>
    </div>

    <!-- Firebase SDK Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        // Your Firebase Configuration Keys
        const firebaseConfig = {
            apiKey: "AIzaSyD1KOQsyVmW_g3UPo2R39XW7VmptgB-jlU",
            authDomain: "punarchakra-b79ea.firebaseapp.com",
            projectId: "punarchakra-b79ea",
            storageBucket: "punarchakra-b79ea.firebasestorage.app",
            messagingSenderId: "894740722467",
            appId: "1:894740722467:web:1940419f84057e8b4dd296"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let isSignUp = false;

        // Toggle Function between Login and Signup modes
        window.toggleMode = function() {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerHTML = isSignUp ? "Industry <span>Registration</span>" : "Industry <span>Login</span>";
            document.getElementById('formSubTitle').innerText = isSignUp ? "Create a profile for resource matching" : "Access your industrial symbiosis dashboard";
            document.getElementById('submitBtn').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('switchText').innerHTML = isSignUp ? 
                `Already registered? <span onclick="toggleMode()">Sign In</span>` : 
                `Need an account? <span onclick="toggleMode()">Sign Up</span>`;
            document.getElementById('statusMsg').innerText = '';
        }

        // Automatic redirection if already authenticated
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Redirect user to dashboard or index page once signed in
                window.location.href = "index.html";
            }
        });

        // Email Form Handler (Handles Login & Signup execution)
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('statusMsg');

            msgBox.style.color = "#aaa";
            msgBox.innerText = "Processing request...";

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                msgBox.style.color = "#ff4d4d";
                msgBox.innerText = error.message;
            }
        });

        // Google Sign-In Trigger
        document.getElementById('googleAuthBtn').addEventListener('click', async () => {
            const msgBox = document.getElementById('statusMsg');
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                msgBox.style.color = "#ff4d4d";
                msgBox.innerText = error.message;
            }
        });
    </script>
</body>
</html>
